# Конфиг Nginx для Wenz (reverse proxy на Next.js, порт 6574)
# Положи этот файл в /etc/nginx/sites-available/wenz и создай симлинк в sites-enabled.

server {
    listen 80;
    server_name example.com www.example.com;  # ЗАМЕНИ на свой домен или IP

    # Перенаправление на HTTPS (раскомментируй после настройки SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:6574;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Кэширование статики Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:6574;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

